# A job running SQL queries on a SQL warehouse
resources:
  jobs:
    customer_segmentation_sql_job:
      name: customer_segmentation_sql_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      email_notifications:
        on_failure:
          - shungubepearlzinhle@gmail.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: bundle_target
          default: ${bundle.target}

      tasks:
        - task_key: bronze_customer_data
          notebook_task:
            warehouse_id: ${var.warehouse_id}
            notebook_path: ../notebooks/bronze/bronze_customer_data.ipynb

        - task_key: silver_customer_data
          depends_on:
            - task_key: bronze_customer_data
          notebook_task:
            warehouse_id: ${var.warehouse_id}
            notebook_path: ../notebooks/silver/silver_customer_data.ipynb

        - task_key: analysis
          depends_on:
            - task_key: silver_customer_data
          notebook_task:
            warehouse_id: ${var.warehouse_id}
            notebook_path: ../notebooks/gold/analysis.ipynb